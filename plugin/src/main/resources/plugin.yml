name: Lorcopika
version: '${version}'
main: lorcopika.LorcopikaPlugin
api-version: '26.2'
authors: [Lorcopika]
description: Lore character mechanics and commands.
commands:
  lore:
    description: Lore character commands
    usage: /lore
    permission: lore.status
permissions:
  lore.admin:
    description: Manage lore characters and mechanics
    default: op
  lore.status:
    description: View your own lore character
    default: true
